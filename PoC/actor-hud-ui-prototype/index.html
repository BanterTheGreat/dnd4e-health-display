<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>4e Actor HUD — UI Prototype</title>
		<link rel="stylesheet" href="prototype.css">
	</head>
	<body>
		<div class="foundry-stage" aria-hidden="true">
			<div class="map-room"></div>
			<div class="token token-a">B</div>
			<div class="token token-b">G</div>
			<div class="token token-c">K</div>
		</div>

		<main id="prototype-root"></main>

		<nav class="prototype-switcher" aria-label="Prototype variants">
			<button type="button" data-direction="-1" aria-label="Previous variant">←</button>
			<div>
				<small>Throwaway prototype</small>
				<strong id="variant-label"></strong>
			</div>
			<button type="button" data-direction="1" aria-label="Next variant">→</button>
		</nav>

		<div id="action-toast" role="status" aria-live="polite"></div>
		<script type="module" src="prototype.js"></script>
	</body>
</html>
